{% extends 'base.html' %}

{% block title %}Iniciar Sesión — Biblioteca IESTP Utcubamba{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 bg-white shadow-sm border-0">
            <!-- Logo Institucional y Títulos -->
            <div class="text-center mb-4">
                <div class="mb-3">
                    <img src="{{ url_for('static', filename='logo.png') }}" 
                         alt="Logo IESTP Utcubamba" 
                         class="img-fluid" 
                         style="max-height: 85px; width: auto;">
                </div>
                <h4 class="fw-bold text-dark mb-1">Acceso a Biblioteca</h4>
                <p class="text-muted small mb-0">Ingresa tus credenciales institucionales</p>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" name="dni" class="form-control" placeholder="Ingresa tu usuario o DNI" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top text-muted" style="font-size: 0.78rem;">
                <i class="bi bi-shield-check text-success me-1"></i> Plataforma segura • IESTP Utcubamba 2026
            </div>
        </div>
    </div>
</div>
{% endblock %}
